<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bé Vui Học</title>
<meta name="description" content="Mỗi ngày 10–15 phút chơi mà học: Toán, Tiếng Việt, Tiếng Anh và kỹ năng đi học cho bé từ mẫu giáo lớn đến lớp 2">
<meta name="theme-color" content="#ffb547">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Phông Andika: chữ "a", "g" viết giống chữ tiểu học */
@font-face { font-family: Andika; font-weight: 400; font-display: swap; src: url(font/r-vi.woff2) format('woff2');
  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: Andika; font-weight: 400; font-display: swap; src: url(font/r-la.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: Andika; font-weight: 700; font-display: swap; src: url(font/b-vi.woff2) format('woff2');
  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: Andika; font-weight: 700; font-display: swap; src: url(font/b-la.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root { --bg: #fff6e6; --card: #fff; --ink: #3b2f2a; --soft: #8a7a70; --sun: #ffb547; --ok: #3fbf4a; --bad: #ff6b6b; --line: #f0e2cc; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Andika, 'Segoe UI', system-ui, sans-serif; overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; touch-action: manipulation;
  background: radial-gradient(circle at 10% 0%, #fff1c9 0, transparent 40%), radial-gradient(circle at 100% 100%, #ffe3ee 0, transparent 45%), var(--bg); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
.scr { position: fixed; inset: 0; display: none; flex-direction: column; overflow-y: auto; padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
.scr.on { display: flex; }
.wrap { width: 100%; max-width: 900px; margin: 0 auto; }
h1 { font-size: clamp(28px, 6vw, 44px); margin: 8px 0; text-align: center; }
h2 { font-size: clamp(22px, 4.5vw, 30px); margin: 10px 0; }
.sub { color: var(--soft); text-align: center; margin: 0 0 18px; font-size: 18px; }
.card { background: var(--card); border-radius: 26px; box-shadow: 0 6px 0 var(--line), 0 10px 24px rgba(120, 80, 30, .08); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 0 28px; border-radius: 999px;
  background: var(--sun); color: #fff; font-size: 24px; font-weight: 700; box-shadow: 0 6px 0 #e3962c; transition: transform .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e3962c; }
.btn.green { background: var(--ok); box-shadow: 0 6px 0 #2d9a37; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 6px 0 var(--line); }
.btn.small { min-height: 48px; font-size: 18px; padding: 0 18px; }
.ico { width: 56px; height: 56px; border-radius: 50%; background: #fff; font-size: 28px; display: grid; place-items: center; box-shadow: 0 4px 0 var(--line); flex: none; }
.ico:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* Chọn bé */
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 200px)); justify-content: center; gap: 18px; margin: 10px 0 24px; }
.kid { padding: 18px 10px; text-align: center; }
.kid .av { font-size: 72px; line-height: 1.1; }
.kid .nm { font-size: 24px; font-weight: 700; margin-top: 6px; }
.kid .st { color: var(--soft); font-size: 15px; }
.kid.add .av { opacity: .5; }
.corner { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; }

/* Tạo bé */
.field { margin: 14px 0; }
.field label { display: block; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.field input { width: 100%; font: inherit; font-size: 24px; padding: 14px 18px; border-radius: 18px; border: 3px solid var(--line); background: #fff; outline: none; }
.field input:focus { border-color: var(--sun); }
.avs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.avs button { font-size: 40px; padding: 8px 0; border-radius: 18px; background: #fff; border: 3px solid transparent; }
.avs button.sel, .chips button.sel { border-color: var(--sun); background: #fff4dc; }
.chips { display: grid; gap: 10px; }
.chips button { text-align: left; padding: 12px 16px; border-radius: 18px; background: #fff; border: 3px solid transparent; font-size: 20px; }
.chips button small { color: var(--soft); display: block; font-size: 15px; }
.chips button:disabled { opacity: .45; }

/* Trang chủ của bé */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.top .me { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.top .me .av { font-size: 44px; }
.top .me .nm { font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 20px; box-shadow: 0 4px 0 var(--line); white-space: nowrap; }
.mission { padding: 18px; margin-bottom: 18px; }
.mission h2 { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.mlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.mi { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 20px; background: #fffaf0; border: 3px solid var(--line); text-align: left; }
.mi .e { font-size: 38px; }
.mi .t { font-size: 17px; font-weight: 700; line-height: 1.2; }
.mi .t small { display: block; font-weight: 400; color: var(--soft); font-size: 14px; }
.mi.done { border-color: var(--ok); background: #effbef; }
.mi.done::after { content: '✔'; position: absolute; top: -10px; right: -8px; width: 32px; height: 32px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 18px; }
.timebar { height: 14px; border-radius: 9px; background: #f3e6d2; overflow: hidden; margin: 6px 0 14px; }
.timebar i { display: block; height: 100%; background: linear-gradient(90deg, #7ccf5a, #ffb547); border-radius: 9px; transition: width .4s; }
.subs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.subj { padding: 16px 10px; text-align: center; border-bottom: 6px solid var(--c); }
.subj .e { font-size: 52px; }
.subj .n { font-size: 21px; font-weight: 700; }
.subj .p { color: var(--soft); font-size: 15px; }
.subj.off { opacity: .4; }

/* Bản đồ bài học */
.path { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0 30px; }
.lsn { width: min(100%, 520px); display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-align: left; }
.lsn:nth-child(even) { transform: translateX(min(8vw, 50px)); }
.lsn:nth-child(odd) { transform: translateX(max(-8vw, -50px)); }
.lsn .bub { width: 76px; height: 76px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 38px; flex: none; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
.lsn .t { font-size: 21px; font-weight: 700; }
.lsn .s { font-size: 22px; letter-spacing: 2px; }
.lsn.lock { filter: grayscale(1); opacity: .55; }
.lsn.next .bub { animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }

/* Màn chơi */
#play { padding-top: max(10px, env(safe-area-inset-top)); }
.pbar { display: flex; align-items: center; gap: 12px; }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 14px; border-radius: 8px; background: #f0e2cc; }
.dots i.ok { background: var(--ok); }
.dots i.cur { background: var(--sun); }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 10px 0; width: 100%; max-width: 900px; margin: 0 auto; }
.prompt { font-size: clamp(20px, 3.8vw, 28px); text-align: center; line-height: 1.35; max-width: 760px; min-height: 1.4em; }
.show { display: flex; justify-content: center; align-items: center; }
.count { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; max-width: 520px; font-size: clamp(44px, 9vw, 64px); padding: 18px 22px; }
.big { font-size: clamp(110px, 24vw, 180px); line-height: 1; padding: 10px 40px; }
.pic { padding: 14px 34px; text-align: center; }
.pic .e { font-size: clamp(80px, 18vw, 130px); line-height: 1.1; }
.pic .w { font-size: clamp(34px, 7vw, 50px); font-weight: 700; }
.scene { font-size: clamp(56px, 12vw, 90px); padding: 12px 28px; letter-spacing: 6px; }
.ear { width: 140px; height: 140px; border-radius: 50%; font-size: 72px; background: #fff; box-shadow: 0 8px 0 var(--line); animation: pulse 1.6s infinite; }
.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; width: 100%; }
.opt { min-width: 130px; min-height: 130px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: transform .1s, opacity .3s; }
.opt:active { transform: scale(.96); }
.opt .e { font-size: 64px; line-height: 1.1; }
.opt.letter { font-size: 92px; font-weight: 700; width: 150px; line-height: 1; }
.opt.num { font-size: 80px; font-weight: 700; width: 140px; }
.opt.group { font-size: 40px; max-width: 300px; flex-direction: row; flex-wrap: wrap; letter-spacing: 2px; }
.opt.wide { flex-direction: row; justify-content: flex-start; min-height: 0; width: min(100%, 560px); text-align: left; gap: 16px; padding: 14px 20px; }
.opt.wide .e { font-size: 50px; }
.opt.wide .t { font-size: 22px; font-weight: 700; }
.opt svg { width: 96px; height: 96px; }
.blob { width: 96px; height: 96px; border-radius: 50%; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); }
.opt.right { outline: 6px solid var(--ok); background: #effbef; }
.opt.dim { opacity: .25; pointer-events: none; }
.opt.glow { animation: glow 1s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 10px rgba(255, 181, 71, .55), 0 6px 0 var(--line); transform: scale(1.05); } }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

.opt.text { font-size: 24px; font-weight: 700; min-height: 84px; min-width: 150px; max-width: 320px; text-align: center; }
.opt.letter { width: auto; min-width: 150px; }
.opt.num { width: auto; min-width: 140px; }
.opt svg.clock { width: 120px; height: 120px; }
.eq { font-size: clamp(48px, 10vw, 80px); font-weight: 700; padding: 10px 34px; white-space: nowrap; }
.wordc { font-size: clamp(36px, 8vw, 60px); font-weight: 700; padding: 14px 34px; text-align: center; }
.readc { font-size: clamp(20px, 3.6vw, 26px); line-height: 1.55; padding: 16px 22px; max-width: 680px; text-align: left; }
.clockc { padding: 12px; }
.clockc svg { width: clamp(170px, 40vw, 240px); height: clamp(170px, 40vw, 240px); display: block; }
/* Xếp thẻ */
.slots, .bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 760px; }
.slots.col, .bank.col { flex-direction: column; align-items: center; }
.slot { min-width: 84px; min-height: 84px; padding: 6px 14px; border-radius: 20px; border: 4px dashed #e2c9a5; background: rgba(255,255,255,.5); font-size: 40px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.slot.wide { width: min(100%, 520px); min-height: 66px; font-size: 20px; justify-content: flex-start; }
.slot.full { border-style: solid; border-color: var(--sun); background: #fff; }
.slot.ok { border-color: var(--ok); background: #effbef; }
.slot .e { font-size: 34px; }
.tile { min-width: 84px; min-height: 84px; padding: 6px 16px; font-size: 40px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.tile.text { font-size: 30px; }
.tile.wide { width: min(100%, 520px); min-height: 64px; font-size: 20px; justify-content: flex-start; }
.tile.wide .e { font-size: 32px; }
.tile.wide, .slot.wide { text-align: left; }
.tile.used { visibility: hidden; }
.bank { padding-top: 6px; border-top: 3px dotted var(--line); }

/* Ghép cặp */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18vw; width: min(100%, 700px); }
.mcol { display: flex; flex-direction: column; gap: 16px; }
.mc { min-height: 110px; display: flex; align-items: center; justify-content: center; font-size: 56px; padding: 8px; flex-wrap: wrap; touch-action: none; }
.mc.l { font-weight: 700; }
.mc.l.letter, .mc.l.num { font-size: 72px; }
.mc.grp { font-size: 30px; }
.mc svg { width: 72px; height: 72px; }
.mc.sel { outline: 5px solid var(--sun); }
.mc.drag { position: relative; z-index: 9; box-shadow: 0 16px 30px rgba(0,0,0,.18); }
.mc.ok { background: #effbef; outline: 5px solid var(--ok); pointer-events: none; }
.mc.hov { outline: 5px dashed var(--sun); }

/* Tô chữ */
.trace { position: relative; padding: 10px; }
.trace canvas { display: block; touch-action: none; border-radius: 20px; }
.trace .bar { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
.trace .meter { height: 12px; width: 100%; background: #f3e6d2; border-radius: 6px; overflow: hidden; margin-top: 10px; }
.trace .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }

/* Hoàn thành */
.finish { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
.stars { font-size: clamp(60px, 14vw, 96px); letter-spacing: 8px; }
.stars span { display: inline-block; animation: pop .5s backwards; }
.stars span.no { filter: grayscale(1); opacity: .3; }
@keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 80% { transform: scale(1.2); } }
.finish .big-e { font-size: 110px; animation: pop .6s; }

/* Khu vườn */
.garden { padding: 20px; text-align: center; }
.pet { font-size: 120px; line-height: 1.1; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.flowers { font-size: 34px; letter-spacing: 4px; line-height: 1.5; min-height: 50px; margin: 12px 0; }
.badges { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.badge { width: 110px; padding: 12px 6px; border-radius: 20px; background: #fffaf0; border: 3px solid var(--line); font-size: 15px; }
.badge b { display: block; font-size: 44px; }
.badge.no { filter: grayscale(1); opacity: .45; }

/* Phụ huynh */
.gate { max-width: 420px; margin: 30px auto; padding: 24px; text-align: center; }
.gate .q { font-size: 40px; font-weight: 700; margin: 10px 0 16px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button { font-size: 28px; font-weight: 700; padding: 14px 0; border-radius: 16px; background: #fffaf0; border: 2px solid var(--line); }
.gate .ans { font-size: 34px; min-height: 50px; letter-spacing: 4px; }
.psec { padding: 18px; margin-bottom: 16px; }
.psec h2 { margin-top: 0; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; font-size: 18px; }
.row .grow { flex: 1; }
.seg { display: inline-flex; border-radius: 999px; background: #f6ead8; padding: 4px; }
.seg button { padding: 8px 16px; border-radius: 999px; font-size: 17px; font-weight: 700; }
.seg button.sel { background: var(--sun); color: #fff; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 10px; }
.bars div { flex: 1; text-align: center; font-size: 13px; color: var(--soft); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.bars i { display: block; background: #7ccf5a; border-radius: 8px 8px 3px 3px; min-height: 3px; margin-bottom: 4px; }
.bars b { font-size: 13px; color: var(--ink); }
.prog { height: 12px; background: #f3e6d2; border-radius: 6px; overflow: hidden; flex: 1; min-width: 100px; }
.prog i { display: block; height: 100%; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #fff0e0; margin: 3px; font-size: 15px; }
.tag.good { background: #e6f8e6; }
.kidtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.kidtabs button { padding: 8px 14px; border-radius: 999px; background: #fff; border: 3px solid var(--line); font-size: 18px; font-weight: 700; }
.kidtabs button.sel { border-color: var(--sun); background: #fff4dc; }
.danger { color: #d33; }

/* Lớp phủ thông báo */
.ov { position: fixed; inset: 0; background: rgba(60, 40, 20, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.ov.on { display: flex; }
.ov .box { max-width: 460px; width: 100%; padding: 26px; text-align: center; }
.ov .box .e { font-size: 90px; }
.ov .box p { font-size: 22px; margin: 10px 0 20px; }
.ov .box .acts { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.fx { position: fixed; pointer-events: none; font-size: 40px; z-index: 60; animation: fly 1s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
@media (max-width: 520px) {
  .opts { gap: 12px; }
  .opt { min-width: 96px; min-height: 96px; }
  .opt.letter { width: auto; min-width: 96px; font-size: 62px; }
  .opt.num { min-width: 96px; }
  .opt.text { font-size: 20px; min-width: 130px; }
  .opt svg.clock { width: 96px; height: 96px; }
  .opt.num { width: auto; font-size: 54px; }
  .opt .e { font-size: 52px; }
  .opt svg, .blob { width: 74px; height: 74px; }
  .match { gap: 12px 12vw; }
  .avs { grid-template-columns: repeat(4, 1fr); }
  .top { gap: 6px; }
  .top .me .av { font-size: 36px; }
  .top .me .nm { font-size: 20px; }
  .pill { font-size: 16px; padding: 6px 10px; }
  .top .ico { width: 46px; height: 46px; font-size: 22px; }
  .mlist { gap: 10px; }
  .mi { padding: 8px 12px; }
}
</style>
</head>
<body>
<section class="scr" id="who"><div class="wrap">
  <button class="ico corner" id="toParent" title="Dành cho bố mẹ">⚙️</button>
  <h1>🌈 Bé Vui Học</h1>
  <p class="sub">Mỗi ngày 10–15 phút chơi mà học</p>
  <div class="kids" id="kids"></div>
</div></section>

<section class="scr" id="newkid"><div class="wrap">
  <div class="top"><button class="ico" data-go="who">⬅️</button><h2 style="margin:0">Thêm hồ sơ cho bé</h2></div>
  <div class="card" style="padding:20px">
    <div class="field"><label>Tên gọi của bé</label><input id="nkName" maxlength="14" placeholder="Ví dụ: Bông" autocomplete="off"></div>
    <div class="field"><label>Chọn hình đại diện</label><div class="avs" id="nkAv"></div></div>
    <div class="field"><label>Bé bắt đầu học từ chặng nào?</label><div class="chips" id="nkStage"></div></div>
    <div style="text-align:center;margin-top:20px"><button class="btn green" id="nkSave">✔ Xong</button></div>
  </div>
</div></section>

<section class="scr" id="home"><div class="wrap">
  <div class="top">
    <button class="me" id="hmSwitch"><span class="av" id="hmAv"></span><span class="nm" id="hmName"></span></button>
    <span class="pill" id="hmStars"></span><span class="pill" id="hmStreak"></span>
    <button class="ico" id="hmMusic" title="Nhạc nền">🎵</button>
  </div>
  <div class="card mission">
    <h2>🎯 Nhiệm vụ hôm nay <span class="pill" id="mStage" style="margin-left:auto"></span></h2>
    <div class="mlist" id="mList"></div>
    <div class="timebar"><i id="mTime"></i></div>
    <div style="text-align:center"><button class="btn" id="mGo">▶ Bắt đầu</button></div>
  </div>
  <div class="subs" id="subs"></div>
</div></section>
